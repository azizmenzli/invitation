<!-- ================= INTRO : THE ENVELOPE ================= -->
<div class="intro" id="intro">
  <div class="intro__inner">
    <div class="intro__head">
      <p class="intro__for" id="introFor" hidden>
        <span data-i18n="introFor"></span>
        <strong id="guestName"></strong>
      </p>
      <p class="intro__kicker" data-i18n="introKicker"></p>
    </div>

    <button class="envelope" id="envelope" type="button" data-i18n-aria="openEnvelope">
      <span class="env__back"></span>
      <!-- The letter that rises out of the envelope: a miniature of the first page -->
      <span class="env__letter" lang="en" dir="ltr">
        <svg class="env__corner env__corner--tl" aria-hidden="true"><use href="#flourish-mini"/></svg>
        <svg class="env__corner env__corner--tr" aria-hidden="true"><use href="#flourish-mini"/></svg>
        <span class="env__script" data-cover="script"></span>
        <span class="env__caps"><span data-cover="line"></span> <b data-cover="bold"></b></span>
        <picture class="env__kids">
          <source srcset="assets/kids.webp" type="image/webp">
          <img src="assets/kids.png" width="900" height="904" alt="">
        </picture>
        <span class="env__names" data-couple-latin></span>
        <span class="env__date" id="envDate"></span>
      </span>
      <span class="env__front">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 100 L46 54 M100 100 L54 54" fill="none" stroke="rgba(60,45,30,.18)" stroke-width=".6" vector-effect="non-scaling-stroke"/>
        </svg>
      </span>
      <span class="env__flap"></span>
      <span class="env__seal"><svg><use href="#seal"/></svg><span data-initials></span></span>
    </button>

    <p class="intro__hint" data-i18n="introHint"></p>
  </div>
  <button class="intro__skip" id="skip" type="button" data-i18n="skip"></button>
</div>

<!-- ================= INVITATION ================= -->
<main class="page" id="page">

  <!-- COVER — page 1 of the printed card -->
  <section class="sheet cover" lang="en" dir="ltr">
    <svg class="corner corner--tl"><use href="#flourish"/></svg>
    <svg class="corner corner--tr"><use href="#flourish"/></svg>
    <svg class="corner corner--bl"><use href="#flourish"/></svg>
    <svg class="corner corner--br"><use href="#flourish"/></svg>

    <div class="cover__content">
      <h1 class="cover__title c-anim">
        <span class="cover__script" data-cover="script"></span>
        <span class="cover__caps"><span data-cover="line"></span> <b data-cover="bold"></b></span>
      </h1>
      <picture class="cover__kids c-anim">
        <source srcset="assets/kids.webp" type="image/webp">
        <img src="assets/kids.png" width="900" height="904" alt="" id="kidsImg">
      </picture>
      <p class="cover__names c-anim">
        <span class="cover__n1" data-latin-name="0"></span>
        <span class="cover__amp">&amp;</span>
        <span class="cover__n2" data-latin-name="1"></span>
      </p>
      <p class="cover__date c-anim" id="coverDate"></p>
    </div>

    <a class="scroll-cue" href="#letter" aria-label="Défiler">
      <span data-i18n="scroll"></span>
      <i></i>
    </a>
  </section>

  <!-- THE INVITATION — page 2 of the printed card -->
  <section class="sheet letter" id="letter">
    <svg class="corner corner--tl"><use href="#flourish"/></svg>
    <svg class="corner corner--tr"><use href="#flourish"/></svg>
    <svg class="corner corner--bl"><use href="#flourish"/></svg>
    <svg class="corner corner--br"><use href="#flourish"/></svg>

    <svg class="art art--glasses reveal" role="img" aria-hidden="true"><use href="#art-glasses"/></svg>
    <p class="letter__bismillah reveal" lang="ar" dir="rtl" id="bismillah">بسم الله الرحمن الرحيم</p>
    <p class="letter__blessing reveal" data-i18n="blessing"></p>

    <p class="letter__lead reveal" data-i18n="hostsLead"></p>
    <p class="letter__hosts reveal" id="hosts"></p>
    <p class="letter__text reveal" data-i18n="inviteText"></p>

    <h2 class="letter__names reveal" data-couple></h2>

    <p class="letter__text reveal" id="letterWhen"></p>
    <p class="letter__date reveal" id="letterDate"></p>

    <p class="letter__text letter__text--gap reveal" id="letterTime"></p>
    <p class="letter__venue reveal" id="letterVenue" dir="ltr"></p>

    <p class="letter__wish reveal" data-i18n="wish"></p>
    <svg class="art art--table reveal" role="img" aria-hidden="true"><use href="#art-table"/></svg>
  </section>

  <!-- QUOTE -->
  <section class="section quote" id="quote">
    <svg class="swash reveal"><use href="#swash"/></svg>
    <blockquote class="quote__text reveal" id="quoteText"></blockquote>
    <svg class="swash swash--flip reveal"><use href="#swash"/></svg>
  </section>

  <!-- COUNTDOWN + PROGRAMME share one frame -->
  <div class="frame-group">
  <svg class="corner corner--sm corner--tl"><use href="#flourish"/></svg>
  <svg class="corner corner--sm corner--tr"><use href="#flourish"/></svg>
  <svg class="corner corner--sm corner--bl"><use href="#flourish"/></svg>
  <svg class="corner corner--sm corner--br"><use href="#flourish"/></svg>

  <!-- COUNTDOWN -->
  <section class="section section--framed countdown">
    <p class="eyebrow reveal" data-i18n="countdownEyebrow"></p>
    <h2 class="title reveal" data-i18n="countdownTitle"></h2>
    <div class="countdown__grid card reveal" id="countdown">
      <div class="cd"><span class="cd__num" data-cd="d">00</span><span class="cd__lbl" data-i18n="days"></span></div>
      <div class="cd"><span class="cd__num" data-cd="h">00</span><span class="cd__lbl" data-i18n="hours"></span></div>
      <div class="cd"><span class="cd__num" data-cd="m">00</span><span class="cd__lbl" data-i18n="minutes"></span></div>
      <div class="cd"><span class="cd__num" data-cd="s">00</span><span class="cd__lbl" data-i18n="seconds"></span></div>
    </div>
    <p class="countdown__done reveal" id="countdownDone" hidden></p>
  </section>

  <!-- PROGRAMME -->
  <section class="section program" id="program">
    <p class="eyebrow reveal" data-i18n="programEyebrow"></p>
    <h2 class="title reveal" data-i18n="programTitle"></h2>
    <svg class="swash swash--sm reveal"><use href="#swash"/></svg>
    <ol class="timeline" id="events"></ol>
  </section>
  </div>

  <!-- VENUE & PRACTICAL INFO -->
  <section class="section venue">
    <p class="eyebrow reveal" data-i18n="venueEyebrow"></p>
    <h2 class="title reveal" data-i18n="venueTitle"></h2>
    <svg class="swash swash--sm reveal"><use href="#swash"/></svg>

    <div class="card venue__card reveal">
      <h3 class="venue__name" id="venueName" dir="ltr"></h3>
      <p class="venue__address" id="venueAddress"></p>
      <div class="venue__map">
        <iframe id="mapFrame" title="Carte" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="btn-row">
        <a class="btn" id="venueDirections" target="_blank" rel="noopener">
          <svg><use href="#i-pin"/></svg><span data-i18n="directions"></span>
        </a>
      </div>
      <p class="venue__cal-label" data-i18n="addCal"></p>
      <div class="btn-row">
        <a class="btn btn--ghost" id="gcal" target="_blank" rel="noopener"><svg><use href="#i-cal"/></svg><span data-i18n="gcal"></span></a>
        <button class="btn btn--ghost" id="ics" type="button"><svg><use href="#i-cal"/></svg><span data-i18n="ics"></span></button>
      </div>
    </div>
  </section>

  <!-- RSVP -->
  <section class="section rsvp" id="rsvp">
    <p class="eyebrow reveal" data-i18n="rsvpEyebrow"></p>
    <h2 class="title reveal" data-i18n="rsvpTitle"></h2>
    <svg class="swash swash--sm reveal"><use href="#swash"/></svg>
    <p class="rsvp__deadline reveal" id="rsvpDeadline"></p>

    <form class="card rsvp__form reveal" id="rsvpForm" novalidate>
      <fieldset class="field">
        <legend class="field__label" data-i18n="rsvpAttend"></legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="attend" value="yes" checked><span data-i18n="yes"></span></label>
          <label class="choice"><input type="radio" name="attend" value="no"><span data-i18n="no"></span></label>
        </div>
      </fieldset>

      <label class="field">
        <span class="field__label"><span data-i18n="rsvpName"></span> *</span>
        <input class="input" type="text" name="name" autocomplete="name" required data-i18n-ph="rsvpNamePh">
      </label>

      <div class="field" id="guestsField">
        <span class="field__label" data-i18n="rsvpGuests"></span>
        <div class="stepper">
          <button type="button" class="stepper__btn" data-step="-1" aria-label="-">−</button>
          <output class="stepper__val" id="guestsVal">1</output>
          <button type="button" class="stepper__btn" data-step="1" aria-label="+">+</button>
        </div>
      </div>

      <fieldset class="field">
        <legend class="field__label"><span data-i18n="rsvpSide"></span> *</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="side" value="bride" required><span data-i18n="sideBride"></span></label>
          <label class="choice"><input type="radio" name="side" value="groom"><span data-i18n="sideGroom"></span></label>
        </div>
      </fieldset>

      <label class="field">
        <span class="field__label" data-i18n="rsvpMsg"></span>
        <textarea class="input input--area" name="message" rows="3" data-i18n-ph="rsvpMsgPh"></textarea>
      </label>

      <p class="rsvp__error" id="rsvpError" role="alert" hidden data-i18n="rsvpErr"></p>
      <button class="btn btn--block" type="submit"><span data-i18n="send"></span></button>
      <p class="rsvp__note" data-i18n="rsvpNote"></p>
    </form>

    <div class="rsvp__thanks" id="rsvpThanks" hidden>
      <svg class="art art--glasses art--sm"><use href="#art-glasses"/></svg>
      <p data-i18n="rsvpThanks"></p>
      <button class="link" type="button" id="rsvpAgain" data-i18n="rsvpAgain"></button>
    </div>
  </section>

  <!-- CLOSING -->
  <footer class="sheet closing">
    <svg class="corner corner--tl"><use href="#flourish"/></svg>
    <svg class="corner corner--tr"><use href="#flourish"/></svg>
    <svg class="corner corner--bl"><use href="#flourish"/></svg>
    <svg class="corner corner--br"><use href="#flourish"/></svg>

    <p class="closing__title reveal" data-i18n="closingTitle"></p>
    <p class="closing__names reveal" data-couple></p>
    <p class="closing__date reveal" id="closingDate"></p>
    <svg class="swash swash--sm reveal"><use href="#swash"/></svg>
    <button class="btn btn--ghost reveal" id="replay" type="button"><svg><use href="#i-replay"/></svg><span data-i18n="replay"></span></button>
  </footer>
</main>

<script src="js/config.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
